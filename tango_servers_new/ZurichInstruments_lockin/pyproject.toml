[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tangods-zi-lockin"
version = "5.1.0"
description = "Zurich Instruments MFLI lock-in TANGO servers (ZI_DAQ / ZI2_DAQ) — one source"
requires-python = ">=3.9"
dependencies = [
    "pytango",
    "numpy",
    # EXACT pin: the zhinst client must not be newer than the LabOne data
    # server on the MFLI, or ziDAQServer refuses to connect.  Measured
    # 2026-08-12 with daq.getString('/zi/about/version'): both MFLIs run
    # LabOne 24.10 (rev 241065175) -- Green 192.168.1.62 and IR 192.168.1.144
    # -- so 24.10.1 (zhinst-core 24.10.65175) matches both and needs no
    # AllowVersionMismatch bypass.  A range pin let pip jump to 25.10.1 and
    # put Green in FAULT; re-measure both servers before ever moving this.
    "zhinst==24.10.1",
]

[project.scripts]
ZI_DAQ  = "zi_lockin:main_zi"
ZI2_DAQ = "zi_lockin:main_zi2"

[tool.setuptools]
packages = ["zi_lockin"]
